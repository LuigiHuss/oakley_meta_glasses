name: Android - Mirella v1.0-teste

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mirella-app/**"
      - ".github/workflows/android-mirella.yml"

permissions:
  contents: write

jobs:
  build-mirella:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Mirella APK
        working-directory: mirella-app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp mirella-app/app/build/outputs/apk/debug/app-debug.apk dist/Mirella-v1.0-teste.apk
          sha256sum dist/Mirella-v1.0-teste.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mirella-v1.0-teste-APK
          path: dist/Mirella-v1.0-teste.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar APK em Releases (link direto para o celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirella-v1.0-teste-${{ github.run_number }}
          name: Mirella v1.0-teste (build ${{ github.run_number }})
          prerelease: true
          files: dist/Mirella-v1.0-teste.apk
          body: |
            APK de teste da Mirella. No celular, toque em Mirella-v1.0-teste.apk para baixar e instalar.
